[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novamed-business-copilot"
version = "1.0.0"
description = "Evidence-grounded AI agent for commercial analytics, RAG, and tool calling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NovaMed AI Business Copilot contributors" }]
dependencies = [
  "fastapi",
  "openai",
  "streamlit",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[tool.setuptools.packages.find]
include = ["app*", "api*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
